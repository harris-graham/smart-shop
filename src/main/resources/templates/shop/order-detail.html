<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Order ' + ${order.orderNumber})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4 no-print">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/orders}">&larr; All orders</a>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-dark" type="button"
                    data-print-target="order-invoice">Print</button>
            <form method="post" th:action="@{/orders/{id}/cancel(id=${order.orderid})}"
                  th:if="${order.status != 'CANCELLED' and order.status != 'DELIVERED'}">
                <button class="btn btn-sm btn-outline-danger" type="submit"
                        onclick="return confirm('Cancel this order?')">Cancel order</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm" id="order-invoice">
        <div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between gap-3 mb-4">
                <div>
                    <h1 class="h4 mb-1">SMART SHOP</h1>
                    <p class="text-muted mb-0">Order <span th:text="${order.orderNumber}">ORD-1</span></p>
                    <p class="text-muted mb-0" th:text="${order.orderDate}">2026-01-01</p>
                </div>
                <div class="text-end">
                    <span class="badge fs-6" data-live="orders-status"
                          th:attr="data-order-id=${order.orderid}"
                          th:classappend="${order.status == 'CANCELLED'} ? 'bg-danger' : (${order.status == 'DELIVERED'} ? 'bg-success' : 'bg-primary')"
                          th:text="${order.status}">PENDING</span>
                    <p class="mb-0 mt-2">Payment: <span th:text="${order.paymentStatus}">PAID</span></p>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <h2 class="h6 text-muted">Customer</h2>
                    <p class="mb-0" th:text="${order.customer == null ? '—' : order.customer.custname}">
                        Customer
                    </p>
                    <p class="mb-0" th:text="${order.customer == null ? '' : order.customer.custpnum}"></p>
                    <p th:text="${order.customer == null ? '' : order.customer.custaddress}"></p>
                </div>
                <div class="col-md-6 text-md-end">
                    <h2 class="h6 text-muted">Sold by</h2>
                    <p class="mb-0" th:text="${order.employee == null ? 'Online' : order.employee.empname}">
                        Employee
                    </p>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table">
                    <thead class="table-light">
                    <tr>
                        <th>Product</th>
                        <th class="text-end">Unit price</th>
                        <th class="text-center">Qty</th>
                        <th class="text-end">Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${order.items}">
                        <td th:text="${item.smartphone == null ? '—' : item.smartphone.smartname}">Product</td>
                        <td class="text-end" th:text="${item.unitPrice} + ' Ar'">0 Ar</td>
                        <td class="text-center" th:text="${item.quantity}">1</td>
                        <td class="text-end" th:text="${item.totalPrice} + ' Ar'">0 Ar</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <th colspan="3" class="text-end">Grand total</th>
                        <th class="text-end" th:text="${order.totalAmount} + ' Ar'">0 Ar</th>
                    </tr>
                    </tfoot>
                </table>
            </div>

            <p class="text-muted mb-0" th:if="${order.notes != null and !order.notes.isEmpty()}">
                <strong>Notes:</strong> <span th:text="${order.notes}"></span>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
