<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Offline')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="hero p-4 p-md-5 mb-4">
                <h1 class="h3 fw-bold mb-2">You are offline</h1>
                <p class="mb-0">
                    The connection dropped. Pages you have already opened stay available,
                    but checkout and stock updates need a connection.
                </p>
            </div>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a class="btn btn-primary" th:href="@{/shop}">Back to the shop</a>
                <a class="btn btn-outline-secondary" th:href="@{/orders}">My orders</a>
                <button class="btn btn-outline-secondary" type="button" data-retry-online>
                    Retry connection
                </button>
            </div>
            <p class="text-muted small mt-4 mb-0">
                The catalogue is cached on this device. New orders, payments and stock
                changes are applied as soon as the connection returns.
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
