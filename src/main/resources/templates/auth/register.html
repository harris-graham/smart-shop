<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body class="bg-dark">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 text-center mb-1">Create your account</h1>
                    <p class="text-center text-muted mb-4">
                        Track orders, save a wishlist and review products.
                    </p>

                    <form th:action="@{/register}" th:object="${registerForm}" method="post">
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="name">Full name</label>
                            <input class="form-control" id="name" th:field="*{name}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" type="email" id="email" th:field="*{email}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="phone">Phone</label>
                                <input class="form-control" id="phone" th:field="*{phone}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="address">Address</label>
                                <input class="form-control" id="address" th:field="*{address}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" type="password" id="password"
                                   th:field="*{password}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="confirmPassword">Confirm password</label>
                            <input class="form-control" type="password" id="confirmPassword"
                                   th:field="*{confirmPassword}" required>
                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}"></div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Create account</button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        Already registered? <a th:href="@{/login}">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
