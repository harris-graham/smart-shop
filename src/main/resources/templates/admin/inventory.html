<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Inventory')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid py-4 px-lg-5">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-1">Inventory</h1>
    <p class="text-muted mb-4">
        Low-stock threshold: <span th:text="${lowStockThreshold}">3</span> units.
    </p>

    <div class="card shadow-sm mb-4" data-live="inventory" data-live-refresh-url="/admin/inventory">
        <div class="card-header bg-white fw-semibold">
            Low stock
            <span class="badge bg-secondary ms-1" data-live-indicator>Live</span>
        </div>
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Product</th>
                    <th class="text-end">Current stock</th>
                    <th style="width: 340px">Adjust stock</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${lowStock}" th:attr="data-stock-row=${product.smartid}">
                    <td>
                        <div class="fw-semibold" th:text="${product.smartname}">Product</div>
                        <small class="text-muted" th:text="${product.smartid}">SP-1</small>
                    </td>
                    <td class="text-end">
                        <span class="badge bg-danger"
                              th:attr="data-stock-smartid=${product.smartid}"
                              th:text="${product.smartqty}">0</span>
                    </td>
                    <td>
                        <form class="row g-1" method="post"
                              th:action="@{/admin/inventory/{id}/adjust(id=${product.smartid})}">
                            <div class="col-4">
                                <input class="form-control form-control-sm" type="number" min="0"
                                       name="newQuantity" th:value="${product.smartqty}" required>
                            </div>
                            <div class="col-5">
                                <input class="form-control form-control-sm" name="notes"
                                       placeholder="Reason">
                            </div>
                            <div class="col-3 d-grid">
                                <button class="btn btn-sm btn-primary" type="submit">Save</button>
                            </div>
                        </form>
                    </td>
                </tr>
                <tr th:if="${lowStock.empty}">
                    <td colspan="3" class="text-center text-muted py-4">
                        No products below the threshold.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white fw-semibold">Stock history</div>
        <div class="table-responsive">
            <table class="table table-hover mb-0" data-datatable>
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Product</th>
                    <th class="text-end">Change</th>
                    <th class="text-end">Previous</th>
                    <th class="text-end">New</th>
                    <th>Type</th>
                    <th>Reference</th>
                    <th>By</th>
                    <th>Notes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${history}">
                    <td th:text="${entry.createdAt}">2026-01-01</td>
                    <td th:text="${entry.smartphone == null ? '—' : entry.smartphone.smartname}">Product</td>
                    <td class="text-end">
                        <span th:text="${entry.quantityChange}">0</span>
                    </td>
                    <td class="text-end" th:text="${entry.previousQty}">0</td>
                    <td class="text-end" th:text="${entry.newQty}">0</td>
                    <td><span class="badge bg-secondary" th:text="${entry.changeType}">SALE</span></td>
                    <td th:text="${entry.referenceId}">1</td>
                    <td th:text="${entry.changedBy == null ? 'System' : entry.changedBy.empname}">System</td>
                    <td th:text="${entry.notes}">Notes</td>
                </tr>
                <tr th:if="${history.empty}">
                    <td colspan="9" class="text-center text-muted py-4">No stock movements yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
