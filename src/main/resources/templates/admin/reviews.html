<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Review moderation')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid py-4 px-lg-5">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
            <h1 class="h3 mb-0">Review moderation</h1>
            <p class="text-muted mb-0">
                <span th:text="${pendingCount}">0</span> review(s) awaiting moderation
            </p>
        </div>
        <form class="d-flex gap-2" method="get" th:action="@{/admin/reviews}">
            <select class="form-select" name="status">
                <option value="" th:selected="${status == null or status == ''}">All reviews</option>
                <option value="PENDING" th:selected="${status == 'PENDING'}">Pending</option>
            </select>
            <button class="btn btn-outline-primary" type="submit">Filter</button>
        </form>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" data-datatable>
                <thead class="table-light">
                <tr>
                    <th>Product</th>
                    <th>Customer</th>
                    <th>Rating</th>
                    <th>Comment</th>
                    <th>Status</th>
                    <th class="no-sort text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="review : ${reviews}">
                    <td th:text="${review.smartphone == null ? '—' : review.smartphone.smartname}">Product</td>
                    <td th:text="${review.customer == null ? '—' : review.customer.custname}">Customer</td>
                    <td><span class="rating" th:text="${review.rating} + '/5'">5/5</span></td>
                    <td style="max-width: 360px" th:text="${review.comment}">Comment</td>
                    <td>
                        <span class="badge"
                              th:classappend="${review.status == 'APPROVED'} ? 'bg-success' : (${review.status == 'REJECTED'} ? 'bg-danger' : 'bg-warning text-dark')"
                              th:text="${review.status}">PENDING</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <form class="d-inline" method="post"
                              th:action="@{/admin/reviews/{id}/moderate(id=${review.reviewid})}">
                            <input type="hidden" name="status" value="APPROVED">
                            <button class="btn btn-sm btn-outline-success" type="submit"
                                    th:disabled="${review.status == 'APPROVED'}">Approve</button>
                        </form>
                        <form class="d-inline" method="post"
                              th:action="@{/admin/reviews/{id}/moderate(id=${review.reviewid})}">
                            <input type="hidden" name="status" value="REJECTED">
                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                    th:disabled="${review.status == 'REJECTED'}">Reject</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${reviews.empty}">
                    <td colspan="6" class="text-center text-muted py-4">No reviews found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
