<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Orders')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid py-4 px-lg-5">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Orders</h1>
        <form class="d-flex gap-2" method="get" th:action="@{/admin/orders}">
            <select class="form-select" name="status">
                <option value="" th:selected="${status == null or status == ''}">All statuses</option>
                <option value="PENDING" th:selected="${status == 'PENDING'}">Pending</option>
                <option value="PROCESSING" th:selected="${status == 'PROCESSING'}">Processing</option>
                <option value="SHIPPED" th:selected="${status == 'SHIPPED'}">Shipped</option>
                <option value="DELIVERED" th:selected="${status == 'DELIVERED'}">Delivered</option>
                <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Cancelled</option>
            </select>
            <button class="btn btn-outline-primary" type="submit">Filter</button>
        </form>
    </div>

    <div class="card shadow-sm" data-live="orders" data-live-refresh-url="/admin/orders">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" data-datatable>
                <thead class="table-light">
                <tr>
                    <th>Order</th>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Employee</th>
                    <th class="text-end">Total</th>
                    <th>Status</th>
                    <th>Payment</th>
                    <th class="no-sort">Update status</th>
                    <th class="no-sort"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td class="fw-semibold" th:text="${order.orderNumber}">ORD-1</td>
                    <td th:text="${order.orderDate}">2026-01-01</td>
                    <td th:text="${order.customer == null ? '—' : order.customer.custname}">Customer</td>
                    <td th:text="${order.employee == null ? '—' : order.employee.empname}">Employee</td>
                    <td class="text-end" th:text="${order.totalAmount} + ' Ar'">0 Ar</td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status == 'CANCELLED'} ? 'bg-danger' : (${order.status == 'DELIVERED'} ? 'bg-success' : 'bg-primary')"
                              th:text="${order.status}">PENDING</span>
                    </td>
                    <td><span class="badge bg-secondary" th:text="${order.paymentStatus}">PAID</span></td>
                    <td>
                        <form class="d-flex gap-1" method="post"
                              th:action="@{/admin/orders/{id}/status(id=${order.orderid})}">
                            <select class="form-select form-select-sm" name="status">
                                <option value="PROCESSING">Processing</option>
                                <option value="SHIPPED">Shipped</option>
                                <option value="DELIVERED">Delivered</option>
                                <option value="CANCELLED">Cancelled</option>
                            </select>
                            <button class="btn btn-sm btn-outline-primary" type="submit">Save</button>
                        </form>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/orders/{id}(id=${order.orderid})}">View</a>
                    </td>
                </tr>
                <tr th:if="${orders.empty}">
                    <td colspan="9" class="text-center text-muted py-4">No orders found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
