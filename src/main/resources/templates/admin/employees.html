<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Employees')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid py-4 px-lg-5">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Employees</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addEmployee">
            Add employee
        </button>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/admin/employees}">
        <div class="col-sm-6 col-md-4">
            <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Search employees">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-primary" type="submit">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/employees}">Reset</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" data-datatable>
                <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th class="text-end">Units sold</th>
                    <th class="no-sort text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="employee : ${employees}">
                    <td class="fw-semibold" th:text="${employee.empname}">Employee</td>
                    <td th:text="${employee.emppnum}">000</td>
                    <td th:text="${employee.empaddress}">Address</td>
                    <td th:text="${employee.empuname}">username</td>
                    <td>
                        <span class="badge"
                              th:classappend="${employee.role == 'ADMIN'} ? 'bg-dark' : 'bg-secondary'"
                              th:text="${employee.role}">EMPLOYEE</span>
                    </td>
                    <td class="text-end" th:text="${employee.salesum}">0</td>
                    <td class="text-end text-nowrap">
                        <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal"
                                th:attr="data-bs-target=|#editEmp-${employee.empid}|">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                                th:attr="data-bs-target=|#deleteEmp-${employee.empid}|"
                                th:if="${employee.role != 'ADMIN'}">Remove</button>
                    </td>
                </tr>
                <tr th:if="${employees.empty}">
                    <td colspan="7" class="text-center text-muted py-4">No employees found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="addEmployee" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <form method="post" th:action="@{/admin/employees}">
                    <div class="modal-header">
                        <h2 class="modal-title h5">Add employee</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Full name</label>
                                <input class="form-control" name="empname" maxlength="60" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone</label>
                                <input class="form-control" name="emppnum" maxlength="20"
                                       pattern="[0-9]*">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Address</label>
                                <input class="form-control" name="empaddress" maxlength="100">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Username</label>
                                <input class="form-control" name="empuname" maxlength="20" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Password</label>
                                <input class="form-control" type="password" name="emppword"
                                       maxlength="60" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Role</label>
                                <select class="form-select" name="role">
                                    <option value="EMPLOYEE">Employee</option>
                                    <option value="ADMIN">Administrator</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-primary" type="submit">Add employee</button>
                        <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:each="employee : ${employees}">
        <div class="modal fade" th:id="|editEmp-${employee.empid}|" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <form method="post"
                          th:action="@{/admin/employees/{id}(id=${employee.empid})}">
                        <div class="modal-header">
                            <h2 class="modal-title h5" th:text="|Edit ${employee.empname}|">Edit employee</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Full name</label>
                                    <input class="form-control" name="empname" maxlength="60"
                                           th:value="${employee.empname}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Phone</label>
                                    <input class="form-control" name="emppnum" maxlength="20"
                                           pattern="[0-9]*" th:value="${employee.emppnum}">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Address</label>
                                    <input class="form-control" name="empaddress" maxlength="100"
                                           th:value="${employee.empaddress}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Username</label>
                                    <input class="form-control" name="empuname" maxlength="20"
                                           th:value="${employee.empuname}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">New password (optional)</label>
                                    <input class="form-control" type="password" name="emppword"
                                           maxlength="60">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Role</label>
                                    <select class="form-select" name="role">
                                        <option value="EMPLOYEE"
                                                th:selected="${employee.role == 'EMPLOYEE'}">Employee</option>
                                        <option value="ADMIN"
                                                th:selected="${employee.role == 'ADMIN'}">Administrator</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-primary" type="submit">Save changes</button>
                            <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="modal fade" th:id="|deleteEmp-${employee.empid}|" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form method="post"
                          th:action="@{/admin/employees/{id}/delete(id=${employee.empid})}">
                        <div class="modal-header">
                            <h2 class="modal-title h5 text-danger">Remove employee</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            Remove <strong th:text="${employee.empname}">employee</strong>?
                            Their sales history is removed as well.
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-danger" type="submit">Remove</button>
                            <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
